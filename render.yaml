services:
  - type: web
    name: filehub
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - { key: BOT_TOKEN, sync: false }
      - { key: BOT_USERNAME, sync: false }
      - { key: CHANNEL_ID, sync: false }
      - { key: BACKUP_CHAT_ID, sync: false }
      - { key: ADMIN_USERNAME, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: ADMIN_TELEGRAM_ID, sync: false }
      - { key: SITE_URL, sync: false }
      - { key: FRONTEND_ORIGINS, sync: false }
      - { key: MAX_UPLOAD_MB, value: "20" }
      - { key: BACKUP_MINUTES, value: "10" }
